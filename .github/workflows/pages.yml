name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Generate Zig API reference
        run: zig build docs
      - name: Assemble documentation site
        run: |
          mkdir -p zig-out/site/api
          cp -R zig-out/docs/. zig-out/site/api/
          cp site/index.html zig-out/site/index.html
          touch zig-out/site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: zig-out/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
